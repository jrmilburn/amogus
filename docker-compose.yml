services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      PORT: 2567
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:2567/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-8080}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./packages/client/dist:/srv/client:ro
    depends_on:
      server:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.8.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      caddy:
        condition: service_started
